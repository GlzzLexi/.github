name: Generate Studio Showcase GIF

on:
  schedule:
    # 09:00 AM PHT = 01:00 UTC
    - cron: '0 1 * * *'
  push:
    branches:
      - main
    paths:
      - 'profile/README.md'
      - '.github/profile/README.md'
      - 'README.md'
      - '.github/scripts/generate_showcase.py'
  workflow_dispatch:

permissions:
  contents: write   # commit the generated GIF
  models: read      # lets GITHUB_TOKEN call GitHub Models (free gpt-4o-mini)

# Never run two builds at once (avoids push conflicts)
concurrency:
  group: showcase-gif
  cancel-in-progress: false

jobs:
  build-showcase-gif:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pillow requests

      - name: Build showcase GIF
        env:
          AI_TOKEN: ${{ secrets.AI_TOKEN || secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.ref_name }}
        run: python .github/scripts/generate_showcase.py

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # -A also stages deleted (old) GIFs and the updated README link
          git add -A

          if git diff --cached --quiet; then
            echo "Nothing changed. Nothing to push."
          else
            git commit -m "chore(showcase): update project showcase gif [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
