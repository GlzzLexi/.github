name: Generate Studio Showcase GIF

on:
  push:
    paths:
      - 'README.md'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-showcase-gif:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install pillow requests

      - name: Generate Dynamic Showcase GIF
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cat << 'EOF' > generate_gif.py
          import os
          import re
          import json
          import requests
          from io import BytesIO
          from PIL import Image, ImageDraw, ImageFont

          README_PATH = "README.md"
          OUTPUT_GIF = "showcase.gif"
          GITHUB_TOKEN = os.environ.get("GH_TOKEN", "")

          # ---------------------------------------------------------
          # 1. READ README
          # ---------------------------------------------------------
          if not os.path.exists(README_PATH):
              print("::error::README.md not found.")
              exit(1)

          with open(README_PATH, "r", encoding="utf-8") as f:
              readme_text = f.read()

          # ---------------------------------------------------------
          # 2. EXTRACT PROJECTS VIA GITHUB MODELS AI (WITH FALLBACK)
          # ---------------------------------------------------------
          def extract_via_ai(text, token):
              url = "https://models.inference.ai.azure.com/chat/completions"
              headers = {
                  "Authorization": f"Bearer {token}",
                  "Content-Type": "application/json"
              }
              payload = {
                  "model": "gpt-4o-mini",
                  "messages": [
                      {
                          "role": "system",
                          "content": (
                              "You are an automated game studio analyzer. Analyze the provided README markdown "
                              "and extract all distinct games/projects (active, upcoming, or prototypes). "
                              "Return ONLY a JSON object with key 'projects' containing an array of objects with: "
                              "'title' (string), 'status' (string), 'genre' (string), 'image_url' (first valid image URL found in that project section, or null), "
                              "and 'tagline' (one punchy sentence summary)."
                          )
                      },
                      {"role": "user", "content": text}
                  ],
                  "response_format": {"type": "json_object"},
                  "temperature": 0.1
              }
              try:
                  res = requests.post(url, headers=headers, json=payload, timeout=20)
                  if res.status_code == 200:
                      data = res.json()
                      content = data["choices"][0]["message"]["content"]
                      return json.loads(content).get("projects", [])
              except Exception as e:
                  print(f"AI API not reachable, switching to fallback parser: {e}")
              return None

          def extract_via_fallback(text):
              print("Running resilient fallback parser...")
              projects = []
              # Find headers like ### or #### Project Name
              sections = re.split(r'\n(?=#{3,4}\s+)', text)
              for sec in sections:
                  lines = sec.strip().splitlines()
                  if not lines:
                      continue
                  header_match = re.match(r'^#{3,4}\s+\[?([^\]\n]+)\]?', lines[0])
                  if not header_match:
                      continue

                  title = header_match.group(1).split('(')[0].strip()
                  if any(w in title.lower() for w in ["about", "roadmap", "pipeline", "open source", "join the team"]):
                      continue

                  status = "In Development"
                  genre = "Roblox Game"
                  for l in lines:
                      if "status:" in l.lower():
                          clean_stat = re.sub(r'[*`]', '', l).split(":", 1)[-1].strip()
                          if clean_stat:
                              status = clean_stat
                      if "genre:" in l.lower():
                          clean_gen = re.sub(r'[*`]', '', l).split(":", 1)[-1].strip()
                          if clean_gen:
                              genre = clean_gen

                  img_match = re.search(r'<img[^>]+src=["\']([^"\']+)["\']|!\[[^\]]*\]\(([^)]+)\)', sec)
                  img_url = None
                  if img_match:
                      img_url = img_match.group(1) or img_match.group(2)

                  projects.append({
                      "title": title,
                      "status": status,
                      "genre": genre,
                      "image_url": img_url,
                      "tagline": "Modular systems & gameplay mechanics built with Luau."
                  })
              return projects

          projects = extract_via_ai(readme_text, GITHUB_TOKEN) if GITHUB_TOKEN else None
          if not projects:
              projects = extract_via_fallback(readme_text)

          print(f"Detected {len(projects)} projects.")
          if not projects:
              print("No projects detected. Exiting.")
              exit(0)

          # ---------------------------------------------------------
          # 3. DRAWING & COMPOSITION (16:9 800x450 Canvas)
          # ---------------------------------------------------------
          WIDTH, HEIGHT = 800, 450
          frames = []

          # Load system fonts safely
          def get_font(size, bold=False):
              font_paths = [
                  "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf",
                  "/usr/share/fonts/truetype/liberation/LiberationSans-Bold.ttf" if bold else "/usr/share/fonts/truetype/liberation/LiberationSans-Regular.ttf"
              ]
              for p in font_paths:
                  if os.path.exists(p):
                      return ImageFont.truetype(p, size)
              return ImageFont.load_default()

          font_title = get_font(26, bold=True)
          font_badge = get_font(13, bold=True)
          font_body = get_font(14)
          font_small = get_font(11)

          def get_status_color(status_str):
              s = status_str.lower()
              if any(k in s for k in ["live", "release"]):
                  return (46, 204, 113)    # Green
              if any(k in s for k in ["priority", "active"]):
                  return (52, 152, 219)    # Blue/Cyan
              if any(k in s for k in ["hold", "delay"]):
                  return (231, 76, 60)     # Red
              return (241, 196, 15)        # Yellow

          # --- Slide 1: Studio Splash Intro ---
          intro = Image.new("RGB", (WIDTH, HEIGHT), color=(15, 18, 24))
          draw_intro = ImageDraw.Draw(intro)
          draw_intro.rectangle([(0, 0), (WIDTH, 4)], fill=(255, 117, 140))
          draw_intro.text((WIDTH//2, 160), "GLZZLEXI STUDIOS", fill=(255, 255, 255), font=get_font(34, bold=True), anchor="mm")
          draw_intro.text((WIDTH//2, 210), "Official Project Pipeline & Showcase", fill=(160, 170, 190), font=get_font(16), anchor="mm")
          draw_intro.text((WIDTH//2, 260), "Modular Luau Systems • Roblox Development", fill=(100, 110, 130), font=get_font(13), anchor="mm")
          draw_intro.rounded_rectangle([(WIDTH//2 - 90, 310), (WIDTH//2 + 90, 345)], radius=6, fill=(255, 117, 140))
          draw_intro.text((WIDTH//2, 327), "glzzlexi.me", fill=(255, 255, 255), font=get_font(14, bold=True), anchor="mm")
          frames.append(intro)

          # --- Slides 2..N: Dynamic Project Cards ---
          for proj in projects:
              card = Image.new("RGB", (WIDTH, HEIGHT), color=(18, 22, 30))
              draw = ImageDraw.Draw(card)

              # Top Accent Border
              status_color = get_status_color(proj.get("status", ""))
              draw.rectangle([(0, 0), (WIDTH, 4)], fill=status_color)

              # Left side: Image preview container (380x280)
              img_rect = (40, 75, 420, 355)
              draw.rounded_rectangle(img_rect, radius=8, fill=(10, 12, 16), outline=(35, 42, 54), width=1)

              proj_img = None
              if proj.get("image_url"):
                  try:
                      res_img = requests.get(proj["image_url"], timeout=8)
                      if res_img.status_code == 200:
                          raw_im = Image.open(BytesIO(res_img.content)).convert("RGB")
                          raw_im.thumbnail((378, 278))
                          # Center image in box
                          offset_x = img_rect[0] + 1 + (378 - raw_im.width) // 2
                          offset_y = img_rect[1] + 1 + (278 - raw_im.height) // 2
                          card.paste(raw_im, (offset_x, offset_y))
                          proj_img = True
                  except Exception as err:
                      print(f"Could not load image for {proj.get('title')}: {err}")

              if not proj_img:
                  draw.text((img_rect[0] + 190, img_rect[1] + 140), "Preview Pending", fill=(70, 80, 95), font=font_body, anchor="mm")

              # Right side: Metadata & Badges
              RIGHT_X = 450
              
              # Studio header breadcrumb
              draw.text((RIGHT_X, 75), "GLZZLEXI STUDIOS • SHOWCASE", fill=(100, 115, 135), font=font_small)

              # Title
              title_txt = proj.get("title", "Untitled Project")
              if len(title_txt) > 24:
                  title_txt = title_txt[:22] + "..."
              draw.text((RIGHT_X, 105), title_txt, fill=(255, 255, 255), font=font_title)

              # Status Badge Pill
              stat_txt = f" {proj.get('status', 'In Development')} ".upper()
              bbox = font_badge.getbbox(stat_txt)
              badge_w = bbox[2] - bbox[0] + 14
              badge_h = 24
              draw.rounded_rectangle([(RIGHT_X, 150), (RIGHT_X + badge_w, 150 + badge_h)], radius=4, fill=status_color)
              draw.text((RIGHT_X + 7, 155), stat_txt, fill=(15, 18, 24), font=font_badge)

              # Genre
              genre_txt = f"Genre: {proj.get('genre', 'Roblox Experience')}"
              draw.text((RIGHT_X, 195), genre_txt, fill=(180, 190, 205), font=font_body)

              # Summary Tagline
              tagline = proj.get("tagline", "Core studio milestone built on modular Luau systems.")
              words = tagline.split()
              line1, line2 = "", ""
              for w in words:
                  if len(line1 + " " + w) < 32:
                      line1 += (" " if line1 else "") + w
                  else:
                      line2 += (" " if line2 else "") + w
              draw.text((RIGHT_X, 235), line1, fill=(130, 140, 155), font=font_small)
              if line2:
                  draw.text((RIGHT_X, 255), line2, fill=(130, 140, 155), font=font_small)

              # Footer prompt
              draw.line([(RIGHT_X, 325), (WIDTH - 40, 325)], fill=(30, 36, 48), width=1)
              draw.text((RIGHT_X, 340), "🔗 Official website: glzzlexi.me", fill=(255, 117, 140), font=font_small)

              frames.append(card)

          # ---------------------------------------------------------
          # 4. SAVE COMPILATION AS LOOPING GIF
          # ---------------------------------------------------------
          # Duration: 2600ms per slide, infinite loop (loop=0)
          frames[0].save(
              OUTPUT_GIF,
              save_all=True,
              append_images=frames[1:],
              duration=2600,
              loop=0,
              optimize=True
          )
          print(f"Generated {OUTPUT_GIF} successfully with {len(frames)} slides.")
          EOF
          python generate_gif.py

      - name: Commit and Push Generated Showcase GIF
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add showcase.gif
          if git status --porcelain | grep -q showcase.gif; then
            git commit -m "chore(showcase): auto-generate updated project showcase gif [skip ci]"
            git push origin main
          else
            echo "Showcase GIF has not changed. Skipping push."
          fi
